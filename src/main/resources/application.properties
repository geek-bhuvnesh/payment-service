spring.application.name=payment-service

# H2 in-memory database configuration
spring.datasource.url = jdbc:h2:mem:paymentdb
spring.datasource.driverClassName = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password =
spring.jpa.database-platform = org.hibernate.dialect.H2Dialect

# Show H2 console for debugging: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Auto-create / update DB schema from entities (good for dev/POC)
spring.jpa.hibernate.ddl-auto=update

# Optional: Show SQL in logs (helpful while learning)
sprint.jpa.show-sql=true
